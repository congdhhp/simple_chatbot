  codellama-13b-instruct-8bit:
    model_id: "codellama/CodeLlama-13b-Instruct-hf"
    display_name: "CodeLlama 13B Instruct (8-bit)"
    description: "Meta's CodeLlama 13B with 8-bit quantization for better quality vs 4-bit"
    device: "cuda"
    torch_dtype: "float16"
    generation_config:
      max_new_tokens: 1024
      temperature: 0.1
      top_p: 0.95
      top_k: 50
      do_sample: true
      repetition_penalty: 1.1
      pad_token_id: 0
    system_prompt: |
      You are an expert coding assistant specialized in software development.
      Provide comprehensive, production-ready code solutions with detailed explanations.
    settings:
      max_conversation_history: 7  # Slightly less due to higher memory usage
      save_conversations: true
      conversation_dir: "conversations"
      use_hf_cache: true
      log_level: "INFO"
      use_flash_attention: true
