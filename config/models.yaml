    settings:
      max_conversation_history: 12  # More history with quantization
      save_conversations: true
      conversation_dir: "conversations"
      use_hf_cache: true
      log_level: "INFO"
      # GPU optimizations for RTX 5060 Ti
      use_flash_attention: true
      max_memory_gb: 14  # Conservative with quantization
      gradient_checkpointing: false
      # Force 4-bit quantization for memory efficiency
      use_4bit_quantization: true

  llama-3.1-8b-instruct-8bit:
    model_id: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    display_name: "Llama 3.1 8B Instruct (8-bit)"
    description: "Meta's Llama 3.1 8B model with 8-bit quantization for balanced performance"
    device: "cuda"
    torch_dtype: "float16"
    generation_config:
      max_new_tokens: 1024
      temperature: 0.7
      top_p: 0.9
