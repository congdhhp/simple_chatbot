      do_sample: true
      repetition_penalty: 1.1
    system_prompt: |
      You are a helpful AI assistant. Provide accurate, concise, and helpful responses.
      Be friendly and professional in your interactions.
    settings:
      max_conversation_history: 11  # Balanced history with 8-bit
      save_conversations: true
      conversation_dir: "conversations"
      use_hf_cache: true
      log_level: "INFO"
      # GPU optimizations for RTX 5060 Ti
      use_flash_attention: true
      max_memory_gb: 14  # Balanced memory for 8-bit quantization
      gradient_checkpointing: false
      # Use 8-bit quantization for balanced performance
      use_8bit_quantization: true
  
  codellama-7b-instruct:
    model_id: "codellama/CodeLlama-7b-Instruct-hf"
    display_name: "CodeLlama 7B Instruct"
    description: "Meta's CodeLlama 7B for code generation and explanation"
    device: "cuda"
    torch_dtype: "float16"
    generation_config:
      max_new_tokens: 1024
      temperature: 0.1  # Lower for code generation
      top_p: 0.95
      top_k: 50
      do_sample: true
      repetition_penalty: 1.1
      pad_token_id: 0  # CodeLlama specific
    system_prompt: |
      You are a helpful coding assistant. Provide accurate, well-documented code solutions.
      Explain your code clearly and follow best practices.
    settings:
      max_conversation_history: 10
      save_conversations: true
      conversation_dir: "conversations"
      use_hf_cache: true
      log_level: "INFO"
      use_flash_attention: true
      max_memory_gb: 13
      gradient_checkpointing: false

  codellama-13b-instruct-4bit:
    model_id: "codellama/CodeLlama-13b-Instruct-hf"
    display_name: "CodeLlama 13B Instruct (4-bit)"
    description: "Meta's CodeLlama 13B with 4-bit quantization for 16GB VRAM"
    device: "cuda"
    torch_dtype: "float16"
    generation_config:
      max_new_tokens: 1024
      temperature: 0.1
      top_p: 0.95
      top_k: 50
      do_sample: true
      repetition_penalty: 1.1
      pad_token_id: 0
