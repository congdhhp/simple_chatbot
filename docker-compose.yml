version: '3.8'

services:
  simple-llm-service:
    build: .
    ports:
      - "8008:8008"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - JWT_SECRET_KEY=your-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config:ro
      - logs_volume:/app/logs
      - conversations_volume:/app/conversations
      - /home/cong/.cache/huggingface:/home/appuser/.cache/huggingface:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  logs_volume:
  conversations_volume:
